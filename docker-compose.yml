name: agentic-rag

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: agentic-rag-backend:local
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/bartowski/mistralai_Ministral-3-8B-Instruct-2512-GGUF:Q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-hf.co/ChristianAzinn/mxbai-embed-large-v1-gguf:Q4_K_M}
      RAGAS_JUDGE_MODEL: ${RAGAS_JUDGE_MODEL:-hf.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M}
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      OFFLINE_MODE: ${DOCKER_OFFLINE_MODE:-false}
      REQUIRE_OLLAMA: ${DOCKER_REQUIRE_OLLAMA:-true}
      REQUIRE_IMAGE_RETRIEVAL: ${DOCKER_REQUIRE_IMAGE_RETRIEVAL:-true}
      REQUIRE_SEMANTIC_MODEL_CACHE: ${DOCKER_REQUIRE_SEMANTIC_MODEL_CACHE:-false}
      YOLOGEN_DATA_ROOT: ${DOCKER_YOLOGEN_DATA_ROOT:-/mounted/vlm/data/processed}
      INDEX_PATH: ${DOCKER_INDEX_PATH:-/mounted/agentic-rag/data/faiss_index}
      HF_HOME: ${DOCKER_HF_HOME:-/mounted/agentic-rag/.cache/huggingface}
      SENTENCE_TRANSFORMERS_HOME: ${DOCKER_SENTENCE_TRANSFORMERS_HOME:-/mounted/agentic-rag/.cache/torch/sentence_transformers}
      API_PUBLIC_BASE_URL: ${DOCKER_API_PUBLIC_BASE_URL:-}
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://backend:8000}
    volumes:
      - ./data/faiss_index:/mounted/agentic-rag/data/faiss_index
      - ./data/manuals:/mounted/agentic-rag/data/manuals:ro
      - ./.cache:/mounted/agentic-rag/.cache
      - ../vlm-yolo-detector/data/processed:/mounted/vlm/data/processed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: agentic-rag-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  vlm-preprocess:
    profiles: ["preprocess"]
    image: python:3.11-slim
    working_dir: /workspace/vlm-yolo-detector
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      pip install --no-cache-dir -r requirements.txt pymupdf sentence-transformers &&
      python scripts/extract_all_images.py --pdf-dir data/manuals --output-dir data/processed --min-size 150 &&
      python scripts/describe_images_vlm.py --index data/processed/image_index.json --model ${VLM_MODEL:-llava:13b} &&
      python scripts/build_embeddings.py
    environment:
      OLLAMA_BASE_URL: ${DOCKER_VLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VLM_MODEL: ${DOCKER_VLM_MODEL:-llava:13b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../vlm-yolo-detector:/workspace/vlm-yolo-detector
